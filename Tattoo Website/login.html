<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Ink Finder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="site-header">
    <div class="logo">Ink Finder</div>
    <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="find-artists.html">Find Artists</a>
        <a href="submit-style.html">Submit Your Style</a>
        <a href="login.html" class="active">Login/Create Account</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>

<main>
    <section class="login">
        <h2>Login or Create Account</h2>

        <form id="loginForm">
            <label>Email:</label>
            <input type="email" id="loginEmail" required>

            <label>Password:</label>
            <input type="password" id="loginPassword" required>

            <button type="submit">Login</button>
        </form>

        <p id="loginMessage"></p>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
